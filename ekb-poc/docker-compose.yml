name: ekb

x-healthcheck: &hc
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 20s

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]

  minio:
    # Upstream minio/minio images were withdrawn from Docker Hub; Bitnami's legacy build is used locally.
    image: bitnamilegacy/minio:2025.4.22-debian-12-r1
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      <<: *hc
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms2g -Xmx2g
      # LOCAL ONLY: security disabled for the laptop POC. Production uses the bank cluster with TLS + auth.
      xpack.security.enabled: "false"
    ports: ["9200:9200"]
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]

  neo4j:
    image: neo4j:5.26.0-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]

  trino:
    image: trinodb/trino:465
    environment:
      PG_READER_PASSWORD: ${PG_READER_PASSWORD}
    ports: ["8085:8080"]   # host 8080 is often taken; UI at http://localhost:8085
    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog:ro
    deploy:
      resources:
        limits:
          memory: 3g
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/v1/info | grep -q '\"starting\":false'"]

  ollama:
    image: ollama/ollama:0.6.8
    ports: ["11434:11434"]
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_CONTEXT_LENGTH: "8192"     # default 2048 silently truncates RAG prompts
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0        # halves KV-cache VRAM so LLM + embedder fit in 8 GB
      OLLAMA_NUM_PARALLEL: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      <<: *hc
      test: ["CMD", "ollama", "list"]

  api:
    build: ./services/api
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - ./data/samples:/samples
      - ./services/api/tests:/srv/tests
      - ./services/api/app:/srv/app   # live code for the POC; remove for an immutable image
    depends_on:
      postgres: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      ollama: { condition: service_healthy }
      minio: { condition: service_healthy }
      trino: { condition: service_healthy }
    healthcheck:
      <<: *hc
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]

  ui:
    build: ./services/ui
    ports: ["8501:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pg_data:
  minio_data:
  es_data:
  neo4j_data:
  ollama_data:
